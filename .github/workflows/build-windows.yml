name: Build Now Bar for Windows
on:
  workflow_dispatch:
  push:
    branches: [feature/display-monitor-clock-format]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build installer and release executables
        shell: pwsh
        run: ./tools/make-setup.ps1 -Jobs 2
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NowBar-Windows-Installer
          path: |
            dist/nowbar-setup.exe
            dist/nowbar.exe
            dist/nowbar-settings.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
